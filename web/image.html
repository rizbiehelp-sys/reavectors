<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="reavectors-key" content="__REAVECTORS_API_KEY__" />
  <meta name="ai-bridge-key" content="__AI_BRIDGE_KEY__" />
  <title>ReaVector · Image Studio</title>
  <link rel="stylesheet" href="/styles.css?v=6" />
  <link rel="stylesheet" href="/ui.css?v=2" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span><strong>reavectors</strong><span class="tag">Image Studio</span></div>
    <nav class="nav">
      <a href="/">2D Vectorizer</a>
      <a href="/image.html" class="active">Image</a>
      <a href="/video.html">Video</a>
      <a href="/model3d.html">AI 3D</a>
      <a href="/product3d.html">Product 3D</a>
      <a href="/help.html">Help</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="controls">
        <label>Main image — the product to preserve
          <input id="main" type="file" accept="image/jpeg,image/png,image/webp" />
        </label>
        <img id="mainPrev" class="refprev" hidden alt="main" />

        <label>Reference images (optional, up to 3)
          <input id="refs" type="file" accept="image/jpeg,image/png,image/webp" multiple />
        </label>
        <div id="refPrev" class="row" style="grid-template-columns:repeat(3,1fr)"></div>

        <label>Prompt
          <textarea id="prompt" rows="3" placeholder="Describe what you want to change..."></textarea>
        </label>

        <label class="check"><input id="preserve" type="checkbox" checked /> Preserve original product (keep label)</label>

        <label>Output
          <select id="output">
            <option value="background">New background scene</option>
            <option value="transparent">Transparent PNG</option>
          </select>
        </label>

        <label>Model
          <select id="model">
            <option value="@cf/black-forest-labs/flux-1-schnell">FLUX.1 Schnell (background / text → image)</option>
            <option value="@cf/black-forest-labs/flux-2-klein-4b">FLUX.2 Klein 4B (edit)</option>
          </select>
        </label>
      </div>

      <div class="actions"><button id="go" class="primary">Generate image</button></div>
      <p id="status" class="status">Upload your product photo, describe the background, then Generate.</p>
      <div id="prog" class="genprog" hidden>
        <div class="row"><div class="spinner" style="margin:0;width:20px;height:20px"></div><span id="count" class="count">0s</span><span id="stageTxt" class="muted"></span></div>
        <div class="bar"><div id="fill"></div></div>
      </div>
    </section>

    <section class="stage">
      <div class="stage-head"><span>Studio</span><span id="meta" class="muted"></span></div>
      <div class="row" style="grid-template-columns:1fr 1fr;display:grid;gap:10px">
        <div class="thumb"><div class="cap">Original</div><img id="orig" alt="original" /></div>
        <div class="thumb"><div class="cap">Result</div><img id="result" alt="result" /></div>
      </div>
      <div class="report" id="understood" hidden></div>
      <div class="actions" id="downloads" style="margin-top:10px;display:none">
        <a id="dlPng" class="btn" download>Download PNG</a>
        <button id="dlJpg">Download JPG</button>
      </div>
    </section>
  </main>

  <script type="module" src="/image.js?v=3"></script>
</body>
</html>
