<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="reavectors-key" content="__REAVECTORS_API_KEY__" />
  <meta name="ai-bridge-key" content="__AI_BRIDGE_KEY__" />
  <title>ReaVector · Image</title>
  <link rel="stylesheet" href="/styles.css?v=6" />
  <link rel="stylesheet" href="/ui.css?v=2" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span><strong>reavectors</strong><span class="tag">Image</span></div>
    <nav class="nav">
      <a href="/">2D Vectorizer</a>
      <a href="/image.html" class="active">Image</a>
      <a href="/video.html">Video</a>
      <a href="/model3d.html">AI 3D</a>
      <a href="/product3d.html">Product 3D</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="controls">
        <label>Provider
          <select id="provider">
            <option value="cloudflare" selected>Cloudflare (fast, free tier)</option>
            <option value="kaggle">Kaggle GPU (queue)</option>
          </select>
        </label>
        <label class="check"><input id="scene" type="checkbox" /> Product scene — keep my label, new background</label>
        <label>Mode
          <select id="mode">
            <option value="text2image">Text → Image</option>
            <option value="image_edit">Edit an image</option>
            <option value="texture">Texture</option>
          </select>
        </label>
      </div>

      <div id="drop" class="drop" tabindex="0">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
        <div class="drop-inner">
          <div class="drop-icon">&#9633;</div>
          <p class="drop-title">Add a photo (optional)</p>
          <p class="drop-sub">needed for Edit / Texture · JPG · PNG · WebP</p>
        </div>
      <img id="refPreview" class="refprev" hidden alt="reference" />
      </div>

      <div class="controls">
        <label>Prompt <input id="prompt" type="text" placeholder="a glass juice bottle on a white background" /></label>
        <label>Model <select id="model"></select></label>
        <label>Steps <output id="stepsOut">30</output><input id="steps" type="range" min="10" max="60" step="5" value="30" /></label>
      </div>

      <div class="actions"><button id="go" class="primary">Generate</button></div>
      <p id="status" class="status">Describe an image and press Generate.</p>
      <div id="prog" class="genprog" hidden>
        <div class="row"><div class="spinner" style="margin:0;width:20px;height:20px"></div><span id="count" class="count">0s</span><span id="stageTxt" class="muted"></span></div>
        <div class="bar"><div id="fill"></div></div>
      </div>
    </section>

    <section class="stage">
      <div class="stage-head"><span>Result</span><span id="meta" class="muted"></span></div>
      <div class="preview" id="preview">Your image appears here.</div>
    </section>
  </main>

  <script type="module" src="/image.js"></script>
</body>
</html>
